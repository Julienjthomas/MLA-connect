name: mla_connect
description: Civic engagement platform for MLA Connect
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  get: 4.7.3
  supabase_flutter: 2.12.4
  flutter_secure_storage: 9.2.4
  pinput: 3.0.1
  cached_network_image: 3.4.1
  flutter_svg: 2.3.0
  shimmer: 3.0.0
  lottie: 3.3.3
  image_picker: 1.2.2
  geolocator: 13.0.4
  dotted_border: 2.1.0
  smooth_page_indicator: 1.2.1
  url_launcher: 6.3.2
  intl: 0.20.2
  permission_handler: 11.4.0
  record: 6.2.0
  just_audio: 0.9.46
  speech_to_text: 7.3.0
  shared_preferences: 2.5.5
  uuid: 4.5.3

  # Networking
  dio: 5.9.2
  retrofit: 4.9.2
  pretty_dio_logger: 1.4.0
  connectivity_plus: 6.1.5

  # Model codegen (annotations)
  freezed_annotation: 3.1.0
  json_annotation: 4.9.0

  # Responsive UI
  flutter_screenutil: 5.9.3

  # Environment config
  envied: 1.3.5

  # Logging
  logger: 2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code generation
  build_runner: ^2.4.13
  retrofit_generator: ^10.2.0
  freezed: ^3.2.0
  json_serializable: ^6.9.0
  envied_generator: ^1.1.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
