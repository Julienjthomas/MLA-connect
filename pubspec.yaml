name: mla_connect
description: Civic engagement platform for MLA Connect
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  get: ^4.6.6
  supabase_flutter: ^2.8.4
  flutter_secure_storage: ^9.2.2
  pinput: ^3.0.1
  cached_network_image: ^3.4.1
  flutter_svg: ^2.2.4
  shimmer: ^3.0.0
  lottie: ^3.3.1
  image_picker: ^1.2.2
  geolocator: ^13.0.1
  dotted_border: ^2.1.0
  smooth_page_indicator: ^1.0.1
  url_launcher: ^6.3.1
  intl: ^0.20.2
  permission_handler: ^11.3.1
  record: ^6.0.0
  just_audio: ^0.9.42
  speech_to_text: ^7.3.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
